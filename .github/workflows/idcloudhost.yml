
name: Deploy via SFTP (Idcloudhost PROD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Upload files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST_IDCLOUDHOST_PROD }}
          username: ${{ secrets.SSH_USER_IDCLOUDHOST_PROD }}
          password: ${{ secrets.SSH_PASSWORD_IDCLOUDHOST_PROD }}
          source: "./*"
          target: "/home/lisence_manager"
          overwrite: true
          strip_components: 0
          command_timeout: 10m

      - name: Restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_IDCLOUDHOST_PROD }}
          username: ${{ secrets.SSH_USER_IDCLOUDHOST_PROD }}
          password: ${{ secrets.SSH_PASSWORD_IDCLOUDHOST_PROD }}
          script: |
            set -e
            cd /home/lisence_manager
            pwd
            pm2 status
            pm2 restart all
